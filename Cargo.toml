[package]
name = "dexrs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
base64 = "0.22"
clap = { version = "4.5", features = ["derive", "string"] }
clap_complete = "4"
fs4 = "0.13"
regex = "1"
serde = { version = "1.0", features = ["derive"] }
serde_json = { version = "1.0", features = ["preserve_order"] }
sha2 = "0.10"
tempfile = "3.12"
time = { version = "0.3", features = ["formatting", "parsing"] }
toml = "0.9"
ureq = { version = "3", features = ["json"] }

[dev-dependencies]
assert_cmd = "2.0"
mockito = "1"
predicates = "3.1"

[[bin]]
name = "dexrs"
path = "src/bin/dexrs.rs"

[[bin]]
name = "dex"
path = "src/bin/dex.rs"
