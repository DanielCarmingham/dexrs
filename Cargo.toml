[package]
name = "dexrs"
version = "0.1.0"
edition = "2024"
license = "MIT"

[dependencies]
anyhow = "1.0"
clap = { version = "4.5", features = ["derive"] }
fs4 = "0.13"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tempfile = "3.12"

[dev-dependencies]
assert_cmd = "2.0"

[[bin]]
name = "dexrs"
path = "src/bin/dexrs.rs"

[[bin]]
name = "dex"
path = "src/bin/dex.rs"
